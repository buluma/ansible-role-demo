---
# tasks file for web
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: latest

- name: Instal PHP-FPM
  ansible.builtin.apt:
    name: ["php", "php-fpm", "php-common", "php-cli", "php-curl"]
    state: latest

- name: Configure php.ini
  ansible.builtin.blockinfile:
    dest: /etc/php/{{ php_version }}/fpm/php.ini
    block: |
      date.time = Asia/Jakarta
      cgi-fix_pathinfo = 0
    backup: true
  notify: restart php-fpm
