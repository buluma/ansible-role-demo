---
- name: Install Sendmail
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  with_items:
    - sendmail
    - sendmail-cf
    - make
    - mailx

- name: Remove Postfix
  ansible.builtin.dnf:
    name: postfix
    state: absent

- name: Copy Sendmail config
  ansible.builtin.copy:
    src: /etc/aliases
    dest: /etc/mail/aliases

- name: Enable Sendmail service
  ansible.builtin.service:
    name: sendmail
    enabled: true
