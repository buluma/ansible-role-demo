---
- name: sendmail | Install Sendmail
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  with_items:
    - sendmail
    - sendmail-cf
    - make
    - mailx
- name: sendmail | Remove Postfix
  ansible.builtin.dnf:
    name: postfix
    state: absent
- name: sendmail | Copy Sendmail config
  ansible.builtin.copy:
    dest: /etc/mail/aliases
    mode: '0644'
    src: /etc/aliases
- name: sendmail | Enable Sendmail service
  ansible.builtin.service:
    enabled: true
    name: sendmail
