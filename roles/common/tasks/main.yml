---
- name: Change repository Ubuntu 18.04Step 4 - Setup 'web' Roles
  ansible.builtin.copy:
    backup: true
    dest: /etc/apt/
    src: sources.list
    mode: '0644'
- name: Update repository and Upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
- name: Set timezone to Africa/Nairobi
  community.general.timezone:
    name: Africa/Nairobi
