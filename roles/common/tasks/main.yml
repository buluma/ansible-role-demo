# TODO: tasks file for common

- name: Change repository Ubuntu 18.04Step 4 - Setup 'web' Roles
  ansible.builtin.copy:
    src: sources.list
    dest: /etc/apt/
    backup: true

- name: Update repository and Upgrade packages
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true

- name: Set timezone to Africa/Nairobi
  community.general.timezone:
    name: Africa/Nairobi
